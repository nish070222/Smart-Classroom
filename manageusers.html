<!DOCTYPE html>
<html lang="en">


<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Manage User
</title>


<link rel="stylesheet" href="style.css">


</head>




<body>




<script src="auth.js"></script>





<script>


// ======================
// ADMIN ONLY
// ======================


let loginUser = JSON.parse(

localStorage.getItem("loginUser")

);



if(!loginUser || loginUser.role!="admin"){


window.location="index.html";


}


</script>









<div class="sidebar">


<h2>

🏫 SmartClass

</h2>




<a href="index.html">

💡 Light Control

</a>




<a href="dashboard.html">

📊 Dashboard

</a>




<a href="history.html">

📅 History

</a>

👥 Manage User

</a>





<div class="side-user">


<p id="adminName">

</p>


</div>





<a href="#" onclick="logout()">

🚪 Logout

</a>



</div>









<div class="main">






<h1>

👥 Pengurusan Pengguna

</h1>





<div class="card">



<h2>

➕ Tambah User

</h2>




<input id="username"

placeholder="Username">



<input id="password"

placeholder="Password">





<select id="role">


<option value="user">

User

</option>


<option value="admin">

Admin

</option>


</select>




<br>



<button class="on"

onclick="addUser()">

Tambah

</button>




</div>









<div class="log">


<h2>

📋 Senarai User

</h2>






<table>


<tr>


<th>

Username

</th>


<th>

Password

</th>


<th>

Role

</th>


<th>

Tindakan

</th>


</tr>




<tbody id="userTable">

</tbody>



</table>



</div>





</div>









<script src="logout.js"></script>








<script>



document.getElementById(

"adminName"

).innerHTML =


"👤 "+loginUser.username;









function displayUsers(){



let users = JSON.parse(

localStorage.getItem("users")

)||[];





let table=document.getElementById(

"userTable"

);





table.innerHTML="";







users.forEach(function(user,index){



table.innerHTML +=`



<tr>


<td>

${user.username}

</td>



<td>

${user.password}

</td>



<td>

${user.role}

</td>




<td>



<button class="edit-btn"

onclick="editUser(${index})">


✏ Edit


</button>




<button class="delete-btn"

onclick="deleteUser(${index})">


🗑 Delete


</button>



</td>



</tr>



`;



});



}









function addUser(){



let username=document.getElementById(

"username"

).value;



let password=document.getElementById(

"password"

).value;



let role=document.getElementById(

"role"

).value;






if(username=="" || password==""){


alert("Sila isi semua maklumat");


return;


}







let users=JSON.parse(

localStorage.getItem("users")

)||[];






users.push({


username:username,


password:password,


role:role


});






localStorage.setItem(

"users",

JSON.stringify(users)

);





alert("User berjaya ditambah");





displayUsers();



}









function editUser(index){



let users=JSON.parse(

localStorage.getItem("users")

);





let username=prompt(

"Username baru",

users[index].username

);





let password=prompt(

"Password baru",

users[index].password

);





let role=prompt(

"Role admin/user",

users[index].role

);






users[index]={


username:username,


password:password,


role:role


};






localStorage.setItem(

"users",

JSON.stringify(users)

);





displayUsers();



}









function deleteUser(index){



let users=JSON.parse(

localStorage.getItem("users")

);






if(users[index].username=="admin"){


alert("Admin utama tidak boleh dipadam");


return;


}





users.splice(index,1);





localStorage.setItem(

"users",

JSON.stringify(users)

);





displayUsers();



}








displayUsers();



</script>





</body>

</html>
