localStorage.getItem("loginUser")

);

window.location="index.html";


}



</script>

<!-- MAIN -->


<div class="dashboard">






<h1>

🏫 Smart Classroom Dashboard

</h1>





<p>

Monitoring Sistem Admin

</p>









<div class="dashboard-card">






<div class="box">


<h2>

⏱ Masa Lampu Hidup

</h2>


<h1 id="dashTimer">

00:00:00

</h1>


</div>










<div class="box">


<h2>

💡 Status Lampu

</h2>


<h1 id="dashLamp">

OFF

</h1>


</div>









<div class="box">


<h2>

📡 ESP32

</h2>


<h1 class="online">

ONLINE

</h1>


</div>









<div class="box">


<h2>

📍 Lokasi

</h2>


<h3>

Makmal Tutorial

</h3>


</div>





</div>













<div class="log">


<h2>

📋 Log Aktiviti

</h2>






<table>



<tr>


<th>

Masa

</th>


<th>

Pengguna

</th>


<th>

Aktiviti

</th>


<th>

Status

</th>


</tr>






<tbody id="activityLog">

</tbody>





</table>





</div>









</div>









<script src="script.js"></script>

<script src="logout.js"></script>









<script>




// ======================
// PAPAR EMAIL ADMIN
// ======================



document.getElementById(

"adminName"

).innerHTML =


"👤 " + 

(loginUser.email || "Admin");











// ======================
// STATUS LAMP
// ======================



let status = localStorage.getItem(

"lampStatus"

);





let lamp = document.getElementById(

"dashLamp"

);






if(status=="ON"){



lamp.innerHTML="ON";


lamp.style.color="green";



}

else{



lamp.innerHTML="OFF";


lamp.style.color="red";



}












// ======================
// LOG AKTIVITI
// ======================



let logs = JSON.parse(

localStorage.getItem("logs")

)||[];






let table = document.getElementById(

"activityLog"

);








logs.forEach(function(log){





table.innerHTML += `



<tr>



<td>

${log.time}

</td>




<td>

${log.user}

</td>





<td>

${log.activity}

</td>





<td>

${log.status}

</td>




</tr>



`;




});








</script>








</body>
