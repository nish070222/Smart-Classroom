<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Smart Classroom History
    </title>

    <link rel="stylesheet" href="history.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<!-- =====================================
     AUTH CHECK
     ===================================== -->

<script src="auth.js"></script>


<!-- =====================================
     SIDEBAR
     ===================================== -->

<div class="sidebar">

    <h2>
        🏫 SmartClass
    </h2>


    <a href="index.html">

        💡 Light Control

    </a>


    <a
        href="dashboard.html"
        id="dashboardMenu">

        📊 Dashboard

    </a>


    <a href="history.html">

        📅 History

    </a>


    <a
        href="manageusers.html"
        id="manageMenu">

        👥 Manage User

    </a>


    <a
        href="#"
        onclick="logout()">

        🚪 Logout

    </a>

</div>


<!-- =====================================
     MAIN
     ===================================== -->

<div class="main">


    <h1>

        📅 Rekod Penggunaan Lampu

    </h1>


    <p id="welcome">

        Smart Classroom Control System

    </p>


    <!-- =====================================
         SUMMARY
         ===================================== -->

    <div class="history-summary">


        <div class="summary-box">

            <h3>

                📊 Jumlah Sesi

            </h3>


            <div
                class="summary-value"
                id="totalSessions">

                0

            </div>

        </div>


        <div class="summary-box">

            <h3>

                ⏱ Jumlah Penggunaan

            </h3>


            <div
                class="summary-value"
                id="totalDuration">

                00:00:00

            </div>

        </div>


        <div class="summary-box">

            <h3>

                📅 Sesi Hari Ini

            </h3>


            <div
                class="summary-value"
                id="todaySessions">

                0

            </div>

        </div>


    </div>


    <!-- =====================================
         HISTORY TABLE
         ===================================== -->

    <div class="history-table-card">


        <h2>

            📋 History Lampu

        </h2>


        <table>


            <thead>

                <tr>

                    <th>
                        Pengguna
                    </th>

                    <th>
                        Role
                    </th>

                    <th>
                        Tarikh
                    </th>

                    <th>
                        Masa Mula
                    </th>

                    <th>
                        Masa Tamat
                    </th>

                    <th>
                        Tempoh
                    </th>

                    <th>
                        Tindakan
                    </th>

                </tr>

            </thead>


            <tbody id="historyTable">

                <tr>

                    <td
                        colspan="7"
                        class="no-record">

                        ⏳ Memuatkan rekod...

                    </td>

                </tr>

            </tbody>


        </table>

    </div>


</div>


<!-- =====================================
     LOGOUT
     ===================================== -->

<script src="logout.js"></script>


<!-- =====================================
     FIREBASE HISTORY
     ===================================== -->

<script
    type="module"
    src="history.js">
</script>


<!-- =====================================
     ROLE MENU + WELCOME
     ===================================== -->

<script>


// =====================================
// USER
// =====================================

const currentUser =

    JSON.parse(
        localStorage.getItem(
            "loginUser"
        )
    );


if (!currentUser) {

    window.location.href =
        "userlogin.html";

}


// =====================================
// WELCOME
// =====================================

if (currentUser) {

    document.getElementById(
        "welcome"
    ).innerHTML =

        "Selamat datang, <b>" +

        (
            currentUser.username ||
            currentUser.email ||
            "User"
        ) +

        "</b> • Smart Classroom Control System";

}


// =====================================
// ROLE MENU
// =====================================

if (
    currentUser &&
    currentUser.role !== "admin"
) {


    const dashboardMenu =

        document.getElementById(
            "dashboardMenu"
        );


    const manageMenu =

        document.getElementById(
            "manageMenu"
        );


    if (dashboardMenu) {

        dashboardMenu.style.display =
            "none";

    }


    if (manageMenu) {

        manageMenu.style.display =
            "none";

    }

}

</script>


</body>

</html>
