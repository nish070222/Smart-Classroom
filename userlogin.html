<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Smart Classroom Login
</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="login-body">


<div class="login-card">


<h1>
🏫 SmartClass
</h1>


<p>
Login Sistem Kawalan Lampu
</p>



<input id="email"

type="email"

placeholder="Email (Gmail)">



<input id="password"

type="password"

placeholder="Password">





<button class="login-btn"

onclick="login()">

LOGIN

</button>



<p id="message"></p>



</div>




<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getAuth,
signInWithEmailAndPassword 
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";





const firebaseConfig = {

apiKey: "AIzaSyCc45wk-89MHpHdIj9q8TREUzFHHJWu24Q",

authDomain: "smart-classroom-351a3.firebaseapp.com",

projectId: "smart-classroom-351a3",

storageBucket: "smart-classroom-351a3.firebasestorage.app",

messagingSenderId: "1031651524426",

appId: "1:1031651524426:web:327b07e9d3f97c8ec78bb3"

};




const app = initializeApp(firebaseConfig);


const auth = getAuth(app);






window.login = function(){



let email = document.getElementById("email").value;


let password = document.getElementById("password").value;





signInWithEmailAndPassword(auth,email,password)



.then((userCredential)=>{



localStorage.setItem(

"loginUser",

JSON.stringify(userCredential.user)

);





document.getElementById("message").innerHTML =

"✅ Login Berjaya";





setTimeout(()=>{


window.location="index.html";


},800);



})





.catch(()=>{


document.getElementById("message").innerHTML =

"❌ Email atau Password salah";


});



}



</script>


</body>

</html>
