<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Smart Classroom Login
</title>


<link rel="stylesheet" href="style.css">

</head>


<body class="login-body">


<div class="login-card">


<h1>
🏫 SmartClass
</h1>


<p>
Login Sistem Kawalan Lampu
</p>



<h3>
📧 Masukkan Email
</h3>


<input 
id="email"
type="email"
placeholder="Contoh: admin@gmail.com">





<h3>
🔒 Masukkan Password
</h3>


<input 
id="password"
type="password"
placeholder="Masukkan password">





<button 
class="login-btn"
id="loginBtn">

LOGIN

</button>



<p id="message"></p>


</div>






<script type="module">


// ==========================
// FIREBASE IMPORT
// ==========================


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";




import {

getFirestore,

collection,

query,

where,

getDocs

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";







// ==========================
// FIREBASE CONFIG
// ==========================


const firebaseConfig = {


apiKey: "AIzaSyCc45wk-89MHpHdIj9q8TREUzFHHJWu24Q",

authDomain: "smart-classroom-351a3.firebaseapp.com",

projectId: "smart-classroom-351a3",

storageBucket: "smart-classroom-351a3.firebasestorage.app",

messagingSenderId: "1031651524426",

appId: "1:1031651524426:web:327b07e9d3f97c8ec78bb3"


};








// START FIREBASE


const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);










// ==========================
// LOGIN
// ==========================


document

.getElementById("loginBtn")

.addEventListener("click", async ()=>{





let email =

document.getElementById("email").value;



let password =

document.getElementById("password").value;







if(email==="" || password===""){



document.getElementById("message").innerHTML =

"⚠️ Sila isi email dan password";


return;


}









try{



// LOGIN AUTH


const userCredential =

await signInWithEmailAndPassword(

auth,

email,

password

);





const user = userCredential.user;







// DEFAULT ROLE


let role = "user";







// CARI USER DALAM FIRESTORE


const q = query(

collection(db,"users"),

where(

"uid",

"==",

user.uid

)

);








const snapshot = await getDocs(q);







snapshot.forEach((doc)=>{


role = doc.data().role;


});









// SIMPAN LOGIN DATA


localStorage.setItem(

"loginUser",

JSON.stringify({

username:user.email,

email:user.email,

uid:user.uid,

role:role

})

);








document.getElementById("message").innerHTML =

"✅ Login Berjaya";








setTimeout(()=>{


window.location.href="index.html";


},700);





}





catch(error){



console.log(error);



document.getElementById("message").innerHTML =

"❌ Email atau Password salah";



}




});



</script>



</body>

</html>
