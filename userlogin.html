<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Classroom Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="login-body">


<div class="login-card">


<h1>
🏫 SmartClass
</h1>


<p>
Login Sistem Kawalan Lampu
</p>



<h3>
📧 Masukkan Email (Gmail)
</h3>


<input 
id="email"
type="email"
placeholder="Contoh: admin@gmail.com">



<h3>
🔒 Masukkan Password
</h3>


<input 
id="password"
type="password"
placeholder="Masukkan password">



<button 
class="login-btn"
id="loginBtn">

LOGIN

</button>



<p id="message"></p>


</div>





<script type="module">


// FIREBASE IMPORT

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getAuth,
signInWithEmailAndPassword 
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";





// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyCc45wk-89MHpHdIj9q8TREUzFHHJWu24Q",

authDomain: "smart-classroom-351a3.firebaseapp.com",

projectId: "smart-classroom-351a3",

storageBucket: "smart-classroom-351a3.firebasestorage.app",

messagingSenderId: "1031651524426",

appId: "1:1031651524426:web:327b07e9d3f97c8ec78bb3"

};





// START FIREBASE

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);






// BUTTON LOGIN

document
.getElementById("loginBtn")
.addEventListener("click", function(){



let email =
document
.getElementById("email")
.value;



let password =
document
.getElementById("password")
.value;





if(email==="" || password===""){


document
.getElementById("message")
.innerHTML =
"⚠️ Sila isi email dan password";


return;


}






signInWithEmailAndPassword(
auth,
email,
password
)



.then((userCredential)=>{



// SIMPAN USER

localStorage.setItem(

"loginUser",

JSON.stringify({

username: email,

role: "admin"

})

);





document
.getElementById("message")
.innerHTML =
"✅ Login Berjaya";






// REDIRECT

setTimeout(function(){


window.location.href = "index.html";


},500);





})






.catch((error)=>{


console.log(error.code);

console.log(error.message);



document
.getElementById("message")
.innerHTML =
"❌ Login gagal : " + error.code;



});



});



</script>



</body>

</html>
