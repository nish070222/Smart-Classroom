<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Smart - Log Masuk Sistem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cupertino.css">
</head>

<body class="login-body">

<div class="login-card">
    <img src="kvsp1.jpeg" class="kv-logo" alt="Logo KVSP1">

    <h1>🏫 E-Smart</h1>
    <p>Sistem Kawalan Bilik Kuliah Pintar</p>

    <h3>📧 Masukkan Email</h3>
    <input 
        id="email"
        type="email"
        placeholder="Contoh: admin@gmail.com"
        autocomplete="email"
    >

    <h3>🔒 Masukkan Password</h3>
    <input 
        id="password"
        type="password"
        placeholder="Masukkan kata laluan"
        autocomplete="current-password"
    >

    <button 
        class="login-btn"
        id="loginBtn">
        LOG MASUK
    </button>

    <p id="message"></p>
</div>

<script type="module">
// ==========================
// FIREBASE IMPORT
// ==========================
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ==========================
// FIREBASE CONFIG
// ==========================
const firebaseConfig = {
    apiKey: "AIzaSyCc45wk-89MHpHdIj9q8TREUzFHHJWu24Q",
    authDomain: "smart-classroom-351a3.firebaseapp.com",
    projectId: "smart-classroom-351a3",
    storageBucket: "smart-classroom-351a3.firebasestorage.app",
    messagingSenderId: "1031651524426",
    appId: "1:1031651524426:web:327b07e9d3f97c8ec78bb3"
};

// START FIREBASE
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ==========================
// LOGIN FUNCTION
// ==========================
const loginBtn = document.getElementById("loginBtn");
const messageEl = document.getElementById("message");

async function handleLogin() {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    if (email === "" || password === "") {
        messageEl.style.color = "var(--danger-red)";
        messageEl.innerHTML = "⚠️ Sila isi email dan password";
        return;
    }

    messageEl.style.color = "var(--primary-blue)";
    messageEl.innerHTML = "⏳ Sedang mengesahkan akaun...";

    try {
        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = userCredential.user;
        let role = "user";

        const q = query(
            collection(db, "users"),
            where("email", "==", user.email)
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
            console.log("User tiada dalam Firestore, default role user");
        } else {
            snapshot.forEach((doc) => {
                role = doc.data().role;
            });
        }

        localStorage.setItem(
            "loginUser",
            JSON.stringify({
                username: user.email,
                email: user.email,
                uid: user.uid,
                role: role
            })
        );

        console.log("ROLE:", role);

        messageEl.style.color = "var(--success-green)";
        messageEl.innerHTML = "✅ Log Masuk Berjaya! Memuatkan...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 600);

    } catch (error) {
        console.log(error);
        messageEl.style.color = "var(--danger-red)";
        messageEl.innerHTML = "❌ Email atau Password tidak tepat";
    }
}

loginBtn.addEventListener("click", handleLogin);

// Enter key support for quick login
document.getElementById("password").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
        handleLogin();
    }
});
document.getElementById("email").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
        document.getElementById("password").focus();
    }
});
</script>

</body>
</html>
