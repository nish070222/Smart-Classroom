</head>


<body>


<script src="auth.js"></script>


<!-- SIDEBAR -->

    <h2>

    <a href="index.html">

<!-- MAIN -->

<div class="main">


    <h1>

    <!-- CLOCK -->

        🕒 Masa Sekarang


        <h2 id="time">

        📅 Tarikh


        <p id="date">

            -

    <!-- LIGHT CONTROL -->

        </p>



        <h1 id="lampStatus">

        <button

            onclick="lampOff()">

        <!-- TIMER -->

            <h2>

                ⏱ Tempoh Lampu Hidup

            </h2>

                00:00:00

        </div>


    </div>



    <!-- SYSTEM STATUS -->

    <div class="info">


        <h2>

            📌 Status Sistem

        </h2>



        <p>

            ESP32:

            <span class="online">

                🟢 ONLINE

        </p>

            Makmal Tutorial

        </p>


    </div>


</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

<script src="logout.js"></script>



<script>


// ======================
// WELCOME USER
// ======================

document.getElementById(
    "welcome"
).innerHTML =

    "Welcome, " +
    (loginUser.email || "User");



// ======================
// ROLE MENU
// ======================

let user = JSON.parse(

    localStorage.getItem("loginUser")

);


if (loginUser.role != "admin") {


    document.getElementById(
        "dashboardMenu"
    ).style.display = "none";


    document.getElementById(
        "manageMenu"
    ).style.display = "none";

}



// ======================
// CLOCK
// ======================

function updateClock() {


    let now = new Date();


    let h = now.getHours();

    let m = now.getMinutes();

    let s = now.getSeconds();



    h = h < 10 ? "0" + h : h;

    m = m < 10 ? "0" + m : m;

    s = s < 10 ? "0" + s : s;



    document.getElementById(
        "time"
    ).innerHTML =

        h + ":" + m + ":" + s;



    let d = now.getDate();

    let mo = now.getMonth() + 1;

    let y = now.getFullYear();



    document.getElementById(
        "date"
    ).innerHTML =

        d + "/" + mo + "/" + y;

}



setInterval(

    updateClock,

    1000

);


updateClock();


</script>


</body>

</html>
